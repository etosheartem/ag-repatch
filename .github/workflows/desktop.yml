name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ag-repatch-windows-x64
            path: dist/ag-repatch.exe
          - os: macos-15
            artifact: ag-repatch-macos-arm64
            path: dist/ag-repatch-macos.dmg
          - os: macos-15-intel
            artifact: ag-repatch-macos-x64
            path: dist/ag-repatch-macos.dmg
          - os: ubuntu-22.04
            artifact: ag-repatch-linux-x64
            path: |
              dist/ag-repatch-linux-x64.AppImage
              dist/ag-repatch-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 desktop-file-utils xvfb
      - run: python -m pip install ".[build]"
      - run: python ag-repatch.py --selftest
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build.py
      - name: Check bundled application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/ag-repatch.exe --smoke-test
          elif [ "$RUNNER_OS" = "Linux" ]; then
            python packaging/check_bundle.py dist/ag-repatch
            LC_ALL=C dist/ag-repatch-linux-x64.AppImage --appimage-extract-and-run --smoke-test
            LC_ALL=ru_RU.UTF-8 dist/ag-repatch-linux-x64.AppImage --appimage-extract-and-run --smoke-test
            # The offscreen check above does not load the xcb plugin a desktop uses.
            LC_ALL=C QT_QPA_PLATFORM=xcb xvfb-run -a dist/ag-repatch-linux-x64.AppImage --appimage-extract-and-run --smoke-test
            mkdir -p build/archive-check
            tar -xzf dist/ag-repatch-linux-x64.tar.gz -C build/archive-check
            build/archive-check/ag-repatch/ag-repatch --smoke-test
          else
            dist/ag-repatch.app/Contents/MacOS/ag-repatch --smoke-test
          fi
      - name: Check update installation
        if: runner.os != 'Windows'
        run: python packaging/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish downloadable apps
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ag-repatch-*
          path: artifacts
      - name: Prepare downloads
        shell: bash
        run: |
          mkdir release
          cp artifacts/ag-repatch-windows-x64/ag-repatch.exe release/ag-repatch-windows-x64.exe
          cp artifacts/ag-repatch-macos-arm64/ag-repatch-macos.dmg release/ag-repatch-macos-arm64.dmg
          cp artifacts/ag-repatch-macos-x64/ag-repatch-macos.dmg release/ag-repatch-macos-x64.dmg
          cp artifacts/ag-repatch-linux-x64/* release/
          cd release
          sha256sum *.exe *.dmg *.AppImage *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.txt <<'NOTES'
          Готовые приложения ag-repatch. Установка Python и сборка из исходников не нужны.

          Новое в 2.1.2:
          - Интерфейс и мастер первого запуска используют русский язык при русской
            системной локали и английский для остальных локалей, включая C.
          - Linux: проверяем запуск собранного приложения на обоих языках.

          Исправлено в 2.1.1:
          - Linux: AppImage и архив больше не закрываются сразу после запуска на системах
            без пакетов libxcb-icccm4, libxcb-keysyms1 и libxcb-shape0 — нужные библиотеки
            теперь входят в сборку.

          Новое в 2.1.0:
          - Мастер первого запуска: установка, подключение и патч.
          - Диагностика порта, HTTPS через прокси и ответа Google с подсказками.
          - Проверка обновлений, загрузка с SHA-256 и установка с перезапуском.
          - Linux: меню приложений, автозапуск и запрос прав через polkit.
          - Отдельные действия, версия и дата копии в карточках установок.
          - Восстановление прерванного патча и блокировка одновременной записи GUI/CLI.
          - Предпросмотр и сохранение отчёта без личных путей, адреса прокси и сырого журнала.

          Поддерживаются Antigravity IDE и самостоятельный agy для работы с Gemini.
          Для agy установка Antigravity IDE не требуется.

          - Windows: скачайте и откройте ag-repatch-windows-x64.exe.
          - Mac с Apple Silicon (M1 и новее): ag-repatch-macos-arm64.dmg.
          - Mac с Intel: ag-repatch-macos-x64.dmg.
          - Linux x64 (Ubuntu 22.04+): ag-repatch-linux-x64.AppImage. Разрешите запуск файла в его свойствах.
          - Linux без FUSE: распакуйте ag-repatch-linux-x64.tar.gz и откройте ag-repatch внутри папки.

          Linux-сборки включают Python и библиотеки интерфейса; самостоятельная сборка не нужна.

          На macOS откройте образ и перенесите приложение в «Программы».
          Сборки не имеют доверенной подписи издателя и нотариализации Apple.
          Сам прокси в приложение не входит.
          NOTES
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "ag-repatch $RELEASE_TAG" --notes-file release-notes.txt "${flags[@]}"
